name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 代码检查（ruff + ES5）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 ruff
        run: python -m pip install --upgrade pip ruff

      - name: Python 语法检查
        run: python -m compileall -q plugin tests tools

      - name: ruff（只查 E4/E7/E9/F/I 这类硬错误）
        run: ruff check plugin tests tools

      - name: 手机脚本语法检查（Node 的宽松解析）
        run: node --check phone/excalibur_agent.js

      - name: 手机脚本必须是纯 ES5（Rhino 不认 ES6）
        run: python tools/check_es5.py

  smoke:
    name: 冒烟测试（协议 + 安全，不需要 AstrBot）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install --upgrade pip aiohttp coverage

      - name: 冒烟测试（35 项断言）+ 覆盖率日志
        run: |
          python -m coverage run tests/smoke_test.py
          python -m coverage report -m

  astrbot:
    name: 集成测试（真实 AstrBot 环境）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 AstrBot
        run: python -m pip install --upgrade pip aiohttp "AstrBot>=4.29.0"

      - name: 工具注册检查（11 个 phone_* 工具）
        run: python tests/import_check.py

      - name: 真插件类 + 真 aiohttp（46 项断言）
        run: python tests/live_server.py
